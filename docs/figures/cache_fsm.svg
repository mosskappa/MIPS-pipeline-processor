<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="300" y="25" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    L1 Cache Controller Finite State Machine
  </text>
  
  <!-- IDLE State -->
  <circle cx="120" cy="120" r="45" fill="#E8F6FF" stroke="#3498DB" stroke-width="3"/>
  <text x="120" y="115" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IDLE</text>
  <text x="120" y="132" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Wait for</text>
  <text x="120" y="145" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">request</text>
  
  <!-- COMPARE_TAG State -->
  <circle cx="300" cy="120" r="45" fill="#FFF3CD" stroke="#F39C12" stroke-width="3"/>
  <text x="300" y="110" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">COMPARE</text>
  <text x="300" y="125" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TAG</text>
  <text x="300" y="145" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Check hit/miss</text>
  
  <!-- WRITE_BACK State -->
  <circle cx="480" cy="200" r="45" fill="#F8D7DA" stroke="#E74C3C" stroke-width="3"/>
  <text x="480" y="195" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WRITE</text>
  <text x="480" y="210" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BACK</text>
  <text x="480" y="230" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Evict dirty</text>
  
  <!-- ALLOCATE State -->
  <circle cx="300" cy="300" r="45" fill="#D4EDDA" stroke="#27AE60" stroke-width="3"/>
  <text x="300" y="295" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALLOCATE</text>
  <text x="300" y="315" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Fetch from</text>
  <text x="300" y="328" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">memory</text>
  
  <!-- UPDATE State -->
  <circle cx="120" cy="300" r="45" fill="#E2E3E5" stroke="#6C757D" stroke-width="3"/>
  <text x="120" y="300" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UPDATE</text>
  <text x="120" y="320" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Write data</text>
  
  <!-- Transitions -->
  <!-- IDLE -> COMPARE_TAG -->
  <path d="M 165 120 L 250 120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="208" y="110" fill="#333" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">request</text>
  
  <!-- COMPARE_TAG -> IDLE (hit) -->
  <path d="M 260 90 Q 200 50 165 90" stroke="#27AE60" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="210" y="55" fill="#27AE60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HIT</text>
  
  <!-- COMPARE_TAG -> WRITE_BACK (miss+dirty) -->
  <path d="M 340 145 L 440 180" stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="410" y="150" fill="#E74C3C" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MISS</text>
  <text x="410" y="165" fill="#E74C3C" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">+dirty</text>
  
  <!-- COMPARE_TAG -> ALLOCATE (miss+clean) -->
  <path d="M 300 165 L 300 250" stroke="#F39C12" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="330" y="210" fill="#F39C12" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MISS</text>
  <text x="330" y="225" fill="#F39C12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">+clean</text>
  
  <!-- WRITE_BACK -> ALLOCATE -->
  <path d="M 445 235 L 345 280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="410" y="270" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">done</text>
  
  <!-- ALLOCATE -> UPDATE -->
  <path d="M 255 300 L 170 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="212" y="290" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">fetched</text>
  
  <!-- UPDATE -> IDLE -->
  <path d="M 120 255 L 120 170" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="100" y="215" fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">done</text>
  
  <!-- Legend -->
  <rect x="30" y="360" width="540" height="35" rx="5" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
  <text x="300" y="383" fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <tspan fill="#27AE60" font-weight="bold">Hit:</tspan> 1 cycle  |  
    <tspan fill="#F39C12" font-weight="bold">Miss (clean):</tspan> ~10 cycles  |  
    <tspan fill="#E74C3C" font-weight="bold">Miss (dirty):</tspan> ~20 cycles
  </text>
</svg>
