<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8449;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="400" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="350" y="30" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    DOE Analysis: Individual Optimization Speedup
  </text>
  
  <!-- Y-axis -->
  <line x1="80" y1="60" x2="80" y2="320" stroke="#333" stroke-width="2"/>
  <text x="40" y="195" fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90, 40, 195)">Speedup (×)</text>
  
  <!-- Y-axis labels -->
  <text x="70" y="320" fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="end">0×</text>
  <line x1="75" y1="320" x2="85" y2="320" stroke="#333" stroke-width="1"/>
  
  <text x="70" y="255" fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="end">1×</text>
  <line x1="75" y1="255" x2="650" y2="255" stroke="#DDD" stroke-width="1" stroke-dasharray="5,5"/>
  
  <text x="70" y="190" fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="end">2×</text>
  <line x1="75" y1="190" x2="650" y2="190" stroke="#DDD" stroke-width="1" stroke-dasharray="5,5"/>
  
  <text x="70" y="125" fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="end">3×</text>
  <line x1="75" y1="125" x2="650" y2="125" stroke="#DDD" stroke-width="1" stroke-dasharray="5,5"/>
  
  <text x="70" y="60" fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="end">4×</text>
  <line x1="75" y1="60" x2="650" y2="60" stroke="#DDD" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- X-axis -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#333" stroke-width="2"/>
  
  <!-- Bars -->
  <!-- Forwarding: 1.07x -->
  <rect x="110" y="250" width="80" height="70" rx="3" fill="url(#barGrad1)"/>
  <text x="150" y="242" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1.07×</text>
  <text x="150" y="345" fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Forwarding</text>
  
  <!-- Branch Pred: 1.01x -->
  <rect x="210" y="254" width="80" height="66" rx="3" fill="url(#barGrad1)"/>
  <text x="250" y="246" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1.01×</text>
  <text x="250" y="345" fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Branch Pred</text>
  
  <!-- Cache: 2.15x (highlighted) -->
  <rect x="310" y="180" width="80" height="140" rx="3" fill="#E74C3C"/>
  <text x="350" y="170" fill="#E74C3C" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2.15×</text>
  <text x="350" y="345" fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Cache</text>
  <text x="350" y="360" fill="#E74C3C" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(Largest!)</text>
  
  <!-- SIMD: 1.15x -->
  <rect x="410" y="245" width="80" height="75" rx="3" fill="url(#barGrad1)"/>
  <text x="450" y="237" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1.15×</text>
  <text x="450" y="345" fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">SIMD</text>
  
  <!-- All Combined: 3.94x (green) -->
  <rect x="530" y="63" width="100" height="257" rx="3" fill="url(#barGrad2)"/>
  <text x="580" y="55" fill="#27AE60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3.94×</text>
  <text x="580" y="345" fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">All Combined</text>
  
  <!-- Legend box -->
  <rect x="85" y="375" width="560" height="22" rx="3" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
  <text x="350" y="391" fill="#333" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    Source: Full Factorial DOE Analysis (2⁴ = 16 configurations) | Vivado 2025.2 Behavioral Simulation
  </text>
</svg>
