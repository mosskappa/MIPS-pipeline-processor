<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <linearGradient id="aluGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="350" y="25" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    8-Lane SIMD Architecture
  </text>
  
  <!-- Single Instruction Box -->
  <rect x="150" y="45" width="400" height="40" rx="8" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
  <text x="350" y="72" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Single Instruction (SIMD_ADD)
  </text>
  
  <!-- Broadcast lines -->
  <line x1="350" y1="85" x2="350" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="110" x2="640" y2="110" stroke="#333" stroke-width="2"/>
  
  <!-- 8 ALU lanes -->
  <g id="lanes">
    <!-- Lane 0 -->
    <line x1="80" y1="110" x2="80" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="50" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="80" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="80" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 0</text>
    <text x="80" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[0]+b[0]</text>
    
    <!-- Lane 1 -->
    <line x1="160" y1="110" x2="160" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="130" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="160" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="160" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 1</text>
    <text x="160" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[1]+b[1]</text>
    
    <!-- Lane 2 -->
    <line x1="240" y1="110" x2="240" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="210" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="240" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="240" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 2</text>
    <text x="240" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[2]+b[2]</text>
    
    <!-- Lane 3 -->
    <line x1="320" y1="110" x2="320" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="290" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="320" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="320" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 3</text>
    <text x="320" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[3]+b[3]</text>
    
    <!-- Lane 4 -->
    <line x1="400" y1="110" x2="400" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="370" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="400" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="400" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 4</text>
    <text x="400" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[4]+b[4]</text>
    
    <!-- Lane 5 -->
    <line x1="480" y1="110" x2="480" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="450" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="480" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="480" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 5</text>
    <text x="480" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[5]+b[5]</text>
    
    <!-- Lane 6 -->
    <line x1="560" y1="110" x2="560" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="530" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="560" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="560" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 6</text>
    <text x="560" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[6]+b[6]</text>
    
    <!-- Lane 7 -->
    <line x1="640" y1="110" x2="640" y2="130" stroke="#333" stroke-width="1"/>
    <rect x="610" y="130" width="60" height="80" rx="5" fill="url(#aluGrad)" stroke="#1A5276" stroke-width="2"/>
    <text x="640" y="160" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU</text>
    <text x="640" y="180" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Lane 7</text>
    <text x="640" y="200" fill="white" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">a[7]+b[7]</text>
  </g>
  
  <!-- Output collection line -->
  <line x1="60" y1="230" x2="640" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="210" x2="80" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="160" y1="210" x2="160" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="240" y1="210" x2="240" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="320" y1="210" x2="320" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="210" x2="400" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="480" y1="210" x2="480" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="560" y1="210" x2="560" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="640" y1="210" x2="640" y2="230" stroke="#333" stroke-width="1"/>
  
  <line x1="350" y1="230" x2="350" y2="250" stroke="#333" stroke-width="2"/>
  
  <!-- Output -->
  <rect x="150" y="250" width="400" height="40" rx="8" fill="#9B59B6" stroke="#7D3C98" stroke-width="2"/>
  <text x="350" y="277" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    y[0:7] = Result Vector (64 bits)
  </text>
  
  <!-- Performance annotation -->
  <rect x="50" y="305" width="600" height="35" rx="5" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
  <text x="350" y="328" fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <tspan font-weight="bold" fill="#27AE60">Performance:</tspan> 8 operations in 1 cycle = 8× throughput improvement
  </text>
</svg>
