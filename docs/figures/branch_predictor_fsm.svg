<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="300" y="25" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    2-Bit Saturating Counter Branch Predictor
  </text>
  
  <!-- States -->
  <!-- SN State -->
  <circle cx="100" cy="120" r="40" fill="#FFE6E6" stroke="#E74C3C" stroke-width="3"/>
  <text x="100" y="115" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SN</text>
  <text x="100" y="135" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">00</text>
  
  <!-- WN State -->
  <circle cx="220" cy="120" r="40" fill="#FFF3E6" stroke="#F39C12" stroke-width="3"/>
  <text x="220" y="115" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">WN</text>
  <text x="220" y="135" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">01</text>
  
  <!-- WT State -->
  <circle cx="380" cy="120" r="40" fill="#E6F3FF" stroke="#3498DB" stroke-width="3"/>
  <text x="380" y="115" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">WT</text>
  <text x="380" y="135" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">10</text>
  
  <!-- ST State -->
  <circle cx="500" cy="120" r="40" fill="#E6FFE6" stroke="#27AE60" stroke-width="3"/>
  <text x="500" y="115" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ST</text>
  <text x="500" y="135" fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">11</text>
  
  <!-- Taken transitions (top arrows, green) -->
  <path d="M 140 100 Q 160 60 200 100" stroke="#27AE60" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="160" y="55" fill="#27AE60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Taken</text>
  
  <path d="M 260 100 Q 300 60 340 100" stroke="#27AE60" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="300" y="55" fill="#27AE60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Taken</text>
  
  <path d="M 420 100 Q 450 60 480 100" stroke="#27AE60" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="450" y="55" fill="#27AE60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Taken</text>
  
  <!-- Not Taken transitions (bottom arrows, red) -->
  <path d="M 200 140 Q 160 180 140 140" stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="160" y="195" fill="#E74C3C" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Not Taken</text>
  
  <path d="M 340 140 Q 300 180 260 140" stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="300" y="195" fill="#E74C3C" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Not Taken</text>
  
  <path d="M 480 140 Q 450 180 420 140" stroke="#E74C3C" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="450" y="195" fill="#E74C3C" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Not Taken</text>
  
  <!-- Prediction labels -->
  <rect x="60" y="220" width="200" height="50" rx="5" fill="#FFE6E6" stroke="#E74C3C" stroke-width="2"/>
  <text x="160" y="242" fill="#E74C3C" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Predict: NOT TAKEN</text>
  <text x="160" y="260" fill="#666" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">MSB = 0 (States 00, 01)</text>
  
  <rect x="340" y="220" width="200" height="50" rx="5" fill="#E6FFE6" stroke="#27AE60" stroke-width="2"/>
  <text x="440" y="242" fill="#27AE60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Predict: TAKEN</text>
  <text x="440" y="260" fill="#666" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">MSB = 1 (States 10, 11)</text>
</svg>
