<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4820F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    5-Stage MIPS Pipeline Architecture
  </text>

  <!-- Pipeline Stages -->
  <!-- IF Stage -->
  <rect x="30" y="60" width="100" height="60" rx="8" fill="url(#stageGrad)" stroke="#2E5D8C" stroke-width="2"/>
  <text x="80" y="85" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">IF</text>
  <text x="80" y="105" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Instruction</text>
  <text x="80" y="115" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Fetch</text>
  
  <!-- IF/ID Register -->
  <rect x="145" y="70" width="30" height="40" rx="3" fill="url(#regGrad)" stroke="#B8860B" stroke-width="1"/>
  <text x="160" y="95" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">IF/ID</text>
  
  <!-- ID Stage -->
  <rect x="190" y="60" width="100" height="60" rx="8" fill="url(#stageGrad)" stroke="#2E5D8C" stroke-width="2"/>
  <text x="240" y="85" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ID</text>
  <text x="240" y="105" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Instruction</text>
  <text x="240" y="115" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Decode</text>
  
  <!-- ID/EX Register -->
  <rect x="305" y="70" width="30" height="40" rx="3" fill="url(#regGrad)" stroke="#B8860B" stroke-width="1"/>
  <text x="320" y="95" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ID/EX</text>
  
  <!-- EX Stage -->
  <rect x="350" y="60" width="100" height="60" rx="8" fill="url(#stageGrad)" stroke="#2E5D8C" stroke-width="2"/>
  <text x="400" y="85" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">EX</text>
  <text x="400" y="105" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Execute</text>
  <text x="400" y="115" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(ALU)</text>
  
  <!-- EX/MEM Register -->
  <rect x="465" y="70" width="30" height="40" rx="3" fill="url(#regGrad)" stroke="#B8860B" stroke-width="1"/>
  <text x="480" y="93" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">EX/</text>
  <text x="480" y="102" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">MEM</text>
  
  <!-- MEM Stage -->
  <rect x="510" y="60" width="100" height="60" rx="8" fill="url(#stageGrad)" stroke="#2E5D8C" stroke-width="2"/>
  <text x="560" y="85" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MEM</text>
  <text x="560" y="105" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Memory</text>
  <text x="560" y="115" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Access</text>
  
  <!-- MEM/WB Register -->
  <rect x="625" y="70" width="30" height="40" rx="3" fill="url(#regGrad)" stroke="#B8860B" stroke-width="1"/>
  <text x="640" y="93" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">MEM/</text>
  <text x="640" y="102" fill="white" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">WB</text>
  
  <!-- WB Stage -->
  <rect x="670" y="60" width="100" height="60" rx="8" fill="url(#stageGrad)" stroke="#2E5D8C" stroke-width="2"/>
  <text x="720" y="85" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">WB</text>
  <text x="720" y="105" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Write</text>
  <text x="720" y="115" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Back</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <line x1="130" y1="90" x2="143" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="175" y1="90" x2="188" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="90" x2="303" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="335" y1="90" x2="348" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="90" x2="463" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="495" y1="90" x2="508" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="90" x2="623" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="655" y1="90" x2="668" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Clock cycles indicator -->
  <text x="80" y="145" fill="#666" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cycle 1</text>
  <text x="240" y="145" fill="#666" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cycle 2</text>
  <text x="400" y="145" fill="#666" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cycle 3</text>
  <text x="560" y="145" fill="#666" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cycle 4</text>
  <text x="720" y="145" fill="#666" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Cycle 5</text>
  
  <!-- Legend -->
  <rect x="30" y="165" width="20" height="15" rx="3" fill="url(#stageGrad)"/>
  <text x="55" y="177" fill="#333" font-family="Arial, sans-serif" font-size="10">Pipeline Stage</text>
  <rect x="140" y="165" width="20" height="15" rx="3" fill="url(#regGrad)"/>
  <text x="165" y="177" fill="#333" font-family="Arial, sans-serif" font-size="10">Pipeline Register</text>
</svg>
